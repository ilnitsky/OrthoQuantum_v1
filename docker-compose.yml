# Default application: JavaScript + Canvas on loopback 8051.
# Use ./compose.sh to retain the existing orthoquantum_lite deployment identity.
version: '2.4'
services:
  lite:
    build: ./web
    image: orthoquantum-lite:test
    ports:
      - '127.0.0.1:${ORTHOQUANTUM_PORT:-8051}:8051'
    environment:
      ORTHODB_PATH: /reference/orthodb.db
      PANTHER_PATH: /reference/panther.sqlite
      PANTHER_BUNDLE_DIR: /reference/panther_v19
      ORTHODB_RELEASE: v11
      ORTHODB_PROXY: '${LITE_ORTHODB_PROXY-socks5h://host.docker.internal:10810}'
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - '${ORTHOQUANTUM_REFERENCE_DIR:-/home/ilnitsky/PANTHERDB}:/reference:ro'
    depends_on:
      - xray-relay
    mem_limit: 384m
    cpus: 1.5
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=32m
  xray-relay:
    image: orthoquantum-lite:test
    network_mode: host
    entrypoint: ['python3', '/xray_relay.py']
    environment:
      XRAY_RELAY_BIND: '${XRAY_RELAY_BIND:-172.17.0.1}'
      XRAY_RELAY_PORT: '10810'
    volumes:
      - ./support_scripts/xray_relay.py:/xray_relay.py:ro
    mem_limit: 64m
    cpus: 0.25
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    read_only: true
