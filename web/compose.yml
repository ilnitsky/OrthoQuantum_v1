version: '2.4'
services:
  lite:
    build: .
    image: orthoquantum-lite:test
    ports:
      - '127.0.0.1:${ORTHOQUANTUM_PORT:-8050}:8051'
    environment:
      ORTHODB_PATH: /reference/orthodb.db
      PANTHER_PATH: /reference/panther.sqlite
      # Activate the validated bundle atomically when the background build publishes it.
      PANTHER_BUNDLE_DIR: /reference/panther_v19
      ORTHODB_RELEASE: v11
      PUBLIC_ORIGINS: '${ORTHOQUANTUM_PUBLIC_ORIGINS:-http://orthoq.bioinf.fbb.msu.ru,https://orthoq.bioinf.fbb.msu.ru}'
      # Optional: set to a reachable Xray SOCKS endpoint for KEGG/InterPro searches.
      ORTHODB_PROXY: '${LITE_ORTHODB_PROXY-socks5h://host.docker.internal:10809}'
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - /home/ilnitsky/PANTHERDB:/reference:ro
    mem_limit: 384m
    cpus: 1.5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m
